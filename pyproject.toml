[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-db-pipeline"
version = "0.1.0"
description = "YouTube scene graphs: Gemini teacher, Gemma student, d3 scoring and LoRA fine-tuning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "Pillow",
  "PyYAML",
  "tqdm",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["artifact_io", "pipeline_runtime", "pipeline_logging", "visual_sampling"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
