# Copy to config.yaml and set the paths. Relative paths resolve from the repository root.
artifacts_root: artifacts

preparation:
  # TXT list of "Category_001.mp4 https://..." lines, numbered from 001 in each category.
  video_list: data/video_list_umd_500_261127.txt
  # Downloaded videos (videos/<content_id>.mp4) and metadata (metadata/<content_id>.json).
  data_root: /path/to/youtube_dataset
  download:
    height: 360            # preferred video height; larger sources are used when it is missing
    cookies_file: null     # yt-dlp cookies file for bot checks; never committed
    sleep_seconds: 10      # pause after each download
    rate_limit_sleep_seconds: 600
    max_rate_limit_retries: 3
    # Corporate network: proxy URL, and the proxy's CA certificate (preferred) or
    # no_check_certificates: true to skip certificate checks entirely.
    proxy: null              # e.g. http://proxy.example.com:8080
    ca_cert_file: null       # e.g. /path/to/company_ca.crt
    no_check_certificates: false
  split:
    seed: 42
    ratios: {train: 0.8, val: 0.1, test: 0.1}
  keyframe_workers: 4

extraction:
  visual_evidence:
    image_resolution: [640, 360]
    scene_duration: 30
    num_keyframes: 6
  vllm:
    gpu_memory_utilization: 0.90
    max_num_seqs: 32
    max_num_batched_tokens: 16384
    max_model_len: auto
    renderer_num_workers: 4
    enable_chunked_prefill: true
    enable_prefix_caching: true
    enforce_eager: false
    async_scheduling: null
  models:
    # Generation models (--model names) name a backend: vllm (local checkpoint) or gemini (Vertex AI).
    gemini:
      backend: gemini
      project_id: your-gcp-project
      location: global
      model_id: gemini-3.8-flash
      temperature: 0.0
      thinking_level: low
      media_resolution: MEDIA_RESOLUTION_LOW
      threads: 32                # requests in flight at once
      scene_max_new_tokens: 1024   # output token limit per scene
    gemma4_e2b:
      backend: vllm
      path: /path/to/models/gemma-4-E2B-it
      mm_processor_kwargs: {max_soft_tokens: 140}   # Image token budget per keyframe; must match between extraction and LoRA training.
      scene_max_new_tokens: 512   # output token limit per scene
  # extract-iab-gt and extract-segment-gt: the Gemini Decisions API runs on the Gemini Developer API, not Vertex AI,
  # so it needs an API key (Cloud Console > Credentials, restricted to "Gemini API").
  iab:
    api_key: YOUR_GEMINI_API_KEY   # set in config.yaml only; never committed
    model_id: gemini-decision-1
    threads: 32                    # scenes classified at once

scoring:
  d3_path: /path/to/models/d3-mini   # local d3 judge; not needed with --d3-server
  batch_size: 8              # d3 questions per forward pass (in-process d3 only)
  server_model: vllm-sr/d3-mini   # --d3-server: model name sent to the server
  server_concurrency: 32     # --d3-server: scenes in flight at once
  foil_seed: 42
  foil_entities: 1           # claims from other videos added per scene to measure false accepts
  foil_actions: 0
  reference_threshold: 0.7   # minimum claim score to enter the pooled recall reference

finetuning:
  min_scene_score: null      # drop teacher scenes whose mean unit score is below this
  score_units: [context, entity, action]

evaluation:
  bge_path: /path/to/models/bge-large-en-v1.5   # text encoder of the teacher agreement
  match_threshold: 0.8       # BGE cosine similarity to pair topics, entities and actions
